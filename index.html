<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Thiết lập bảng mã, khả năng hiển thị responsive và màu thanh trình duyệt. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Khám phá game miễn phí | GameX</title>
    <!-- Kiểu dáng và mã xử lý danh sách game của trang khám phá. -->
    <link rel="stylesheet" href="Css/index.css">
</head>
<body>
    <!-- Thanh điều hướng chính, ô tìm kiếm và các thao tác tài khoản. -->
    <header class="topbar" style="position: sticky; top: 0; z-index: 1000;">
        <div class="topbar-inner">
            <a class="brand" href="#" aria-label="GameX trang chủ">
                <span class="brand-icon" aria-hidden="true">🎮</span>
                <span>GameX</span>
            </a>
            <nav class="nav-links" aria-label="Điều hướng chính">
                <a class="active" href="#">Khám phá</a>
                <a href="#">Cộng đồng</a>
                <a href="#">Devs</a>
            </nav>
            <div class="search flex">
                <span>🔍</span>
                <input id="gameSearch" type="search" placeholder="Tìm kiếm game..." aria-label="Tìm kiếm game">
            </div>
            <button class="icon-button" type="button" aria-label="Thông báo">♧</button>
            <button class="upload-button" type="button"><span aria-hidden="true">↥</span> Upload game</button>
            <button class="profile" type="button" aria-label="Tài khoản">
                <span class="avatar" aria-hidden="true">👨🏻‍💻</span>
                <span aria-hidden="true">Account</span>
            </button>
        </div>
    </header>

    <main>
        <!-- Phần giới thiệu tiêu đề và nội dung của trang khám phá. -->
        <section class="intro" aria-labelledby="page-title">
            <div>
                <div class="breadcrumb">Trang chủ <span>/</span> Kho game miễn phí</div>
                <h1 id="page-title">Khám phá game miễn phí</h1>
                <p class="subtitle">Khám phá các trò chơi miễn phí trên PC và trình duyệt.</p>
            </div>
        </section>

        <!-- Khu vực danh sách game, tùy chọn sắp xếp và nút tải thêm. -->
        <section class="catalog" aria-label="Danh sách trò chơi">
            <div class="sortbar">
                <div class="result-count" id="resultCount" aria-live="polite">Đang tải game...</div>
                <div class="sort-options" aria-label="Sắp xếp trò chơi">
                    <span class="sort-label">Sắp xếp:</span>
                    <button class="sort-button active" type="button" data-sort="newest" aria-pressed="true">Mới nhất</button>
                    <button class="sort-button" type="button" data-sort="az" aria-pressed="false">Tên A-Z</button>
                    <button class="sort-button" type="button" data-sort="za" aria-pressed="false">Tên Z-A</button>
                </div>
            </div>

            <div class="game-grid" id="gameGrid" aria-live="polite">
                <p class="message">Đang tải game...</p>
            </div>
            <button class="load-more" id="loadMore" type="button" hidden>Tải thêm game</button>
        </section>
    </main>

    <!-- defer để tải script mà không chặn việc phân tích HTML. -->
    <script src="Js/index.js" defer></script>
</body>
</html>
